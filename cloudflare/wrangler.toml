# Cloudflare Pages copy of Go Around: static site from ../../site + Pages Functions in ./functions (cloudflare/README.md).
# Secrets (never in the repo): SITE_PASSWORD, ADMIN_DASH_SECRET.
# Optional later: CF_ANALYTICS_TOKEN (read-only Cloudflare Analytics).
name = "go-around-aero"
pages_build_output_dir = "../site"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "WX"
id = "YOUR_WX_KV_NAMESPACE_ID"

# Dedicated visitor-log namespace (not the weather WX store). Preview/stopgap until D1 can be created.
# D1 is preferred (100,000 writes/day vs KV's shared 1,000 writes/day). The token in use could not create D1.
[[kv_namespaces]]
binding = "VISITORS_KV"
id = "YOUR_VISITORS_KV_NAMESPACE_ID"


# Investigator permanent log (15 Nov 2026): D1 go-around-db (binding INV_DB).
# Top-level bindings apply to production. Preview does not inherit, so it repeats WX, VISITORS_KV and INV_DB.
# MT yes 15 Nov (card t2224s7410): connect go-around-db to live for the permanent investigator log.
[[d1_databases]]
binding = "INV_DB"
database_name = "go-around-db"
database_id = "YOUR_D1_DATABASE_ID"

[env.preview]
[[env.preview.kv_namespaces]]
binding = "WX"
id = "YOUR_WX_KV_NAMESPACE_ID"

[[env.preview.kv_namespaces]]
binding = "VISITORS_KV"
id = "YOUR_VISITORS_KV_NAMESPACE_ID"

[[env.preview.d1_databases]]
binding = "INV_DB"
database_name = "go-around-db"
database_id = "YOUR_D1_DATABASE_ID"
